[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fool4school"
version = "0.2.0"
description = "Fool4School PDF library and F4S_JOB backend"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24",
  "pypdf>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
